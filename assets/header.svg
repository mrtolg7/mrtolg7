<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mert Olgun — full-stack developer">
  <title>Mert Olgun — full-stack developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1c1038"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
    <clipPath id="t1"><rect x="96" y="178" height="40" width="0">
      <animate attributeName="width" begin="0s" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.1;0.27;0.32;1" values="0;330;330;0;0"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="96" y="178" height="40" width="0">
      <animate attributeName="width" begin="4s" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.12;0.27;0.32;1" values="0;650;650;0;0"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="96" y="178" height="40" width="0">
      <animate attributeName="width" begin="8s" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.11;0.27;0.32;1" values="0;480;480;0;0"/>
    </rect></clipPath>
  </defs>

  <style>
    .blob { animation: drift 16s ease-in-out infinite alternate; }
    .b2 { animation-duration: 21s; animation-delay: -7s; }
    .b3 { animation-duration: 25s; animation-delay: -12s; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(140px, 50px); } }
    .hello { font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a78bfa; }
    .name { font: 800 68px 'Segoe UI', -apple-system, Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.5px; }
    .type { font: 500 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e2e8f0; }
    .prompt { font: 700 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #22d3ee; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glyph { font: 700 150px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b5cf6; opacity: 0.18; animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-12px); } }
    .star { fill: #ffffff; animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: -1s; } .s3 { animation-delay: -2s; } .s4 { animation-delay: -0.5s; } .s5 { animation-delay: -1.7s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    .chip { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ddd6fe; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <circle class="blob" cx="980" cy="60" r="140" fill="#8b5cf6" opacity="0.55" filter="url(#soft)"/>
    <circle class="blob b2" cx="760" cy="280" r="120" fill="#22d3ee" opacity="0.35" filter="url(#soft)"/>
    <circle class="blob b3" cx="140" cy="-20" r="120" fill="#6366f1" opacity="0.35" filter="url(#soft)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle class="star" cx="820" cy="70" r="2"/>
    <circle class="star s2" cx="1110" cy="210" r="1.6"/>
    <circle class="star s3" cx="700" cy="120" r="1.4"/>
    <circle class="star s4" cx="1150" cy="60" r="1.8"/>
    <circle class="star s5" cx="890" cy="250" r="1.5"/>

    <text class="glyph" x="870" y="205">&lt;/&gt;</text>

    <text class="hello" x="96" y="92">// hello, world — I'm</text>
    <text class="name" x="92" y="158" fill="url(#nameGrad)">Mert Olgun</text>

    <text class="prompt" x="64" y="208">&gt;</text>
    <g clip-path="url(#t1)"><text class="type" x="96" y="208">full-stack developer</text></g>
    <g clip-path="url(#t2)"><text class="type" x="96" y="208">building for education &amp; public services</text></g>
    <g clip-path="url(#t3)"><text class="type" x="96" y="208">rag · .net · react · postgres</text></g>

    <g class="caret">
      <rect x="96" y="186" width="13" height="28" rx="2" fill="#22d3ee" opacity="0">
        <animate attributeName="x" begin="0s" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.1;0.27;0.32;1" values="96;426;426;96;96"/>
        <animate attributeName="opacity" begin="0s" dur="12s" repeatCount="indefinite" calcMode="discrete"
          keyTimes="0;0.3333" values="1;0"/>
      </rect>
      <rect x="96" y="186" width="13" height="28" rx="2" fill="#22d3ee" opacity="0">
        <animate attributeName="x" begin="4s" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.12;0.27;0.32;1" values="96;746;746;96;96"/>
        <animate attributeName="opacity" begin="4s" dur="12s" repeatCount="indefinite" calcMode="discrete"
          keyTimes="0;0.3333" values="1;0"/>
      </rect>
      <rect x="96" y="186" width="13" height="28" rx="2" fill="#22d3ee" opacity="0">
        <animate attributeName="x" begin="8s" dur="12s" repeatCount="indefinite"
          keyTimes="0;0.11;0.27;0.32;1" values="96;576;576;96;96"/>
        <animate attributeName="opacity" begin="8s" dur="12s" repeatCount="indefinite" calcMode="discrete"
          keyTimes="0;0.3333" values="1;0"/>
      </rect>
    </g>

    <g transform="translate(96 244)">
      <rect width="148" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.45"/>
      <circle cx="16" cy="14" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text class="chip" x="28" y="18.5">open to work</text>
      <rect x="160" width="170" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.45"/>
      <text class="chip" x="176" y="18.5">İzmir, Türkiye</text>
      <rect x="342" width="196" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.45"/>
      <text class="chip" x="358" y="18.5">final-year CS @ DEU</text>
    </g>
  </g>
</svg>
