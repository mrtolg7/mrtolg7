<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Thanks for scrolling this far">
  <title>Thanks for scrolling this far</title>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <path id="wave" d="M0 70 Q150 30 300 70 T600 70 T900 70 T1200 70 T1500 70 T1800 70 V150 H0 Z"/>
    <clipPath id="c"><rect width="1200" height="150" rx="0"/></clipPath>
  </defs>
  <style>
    .w1 { animation: slide 12s linear infinite; }
    .w2 { animation: slide 18s linear infinite reverse; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .msg { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
  </style>
  <g clip-path="url(#c)">
    <g transform="translate(0 8)"><use href="#wave" class="w2" fill="url(#w)" opacity="0.35"/></g>
    <g transform="translate(0 22)"><use href="#wave" class="w1" fill="url(#w)" opacity="0.9"/></g>
  </g>
  <text class="msg" x="600" y="130" text-anchor="middle">thanks for scrolling this far — git commit -m "say hi"</text>
</svg>
